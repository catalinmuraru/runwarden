# Values for the local kind test: the examples image loaded into the cluster, no sign-in.
image:
  repository: runwarden-examples
  tag: dev
  pullPolicy: Never
auth:
  methods: [none]
  allowNoAuth: true
existingSecret: runwarden-env
limits:
  runTimeout: 10m
persistence:
  size: 1Gi
  keepOnUninstall: false
workspace:
  enabled: true
  size: 1Gi
  keepOnUninstall: false
# Created by deploy/kind/test.sh; acceptance has none on purpose (missing-secret check).
secrets:
  common: runwarden-secrets-common
  environments:
    development: runwarden-secrets-development
    production: runwarden-secrets-production

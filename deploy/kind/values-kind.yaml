# Values for the local kind test: the examples image plus kubectl and a test runner, loaded
# into the cluster, no sign-in.
image:
  repository: runwarden-e2e
  tag: dev
  pullPolicy: Never
auth:
  methods: [none]
  allowNoAuth: true
existingSecret: runwarden-env
limits:
  runTimeout: 10m
persistence:
  size: 1Gi
  keepOnUninstall: false
workspace:
  enabled: true
  size: 1Gi
  keepOnUninstall: false
# Created by deploy/kind/test.sh; acceptance has none on purpose (missing-secret check).
secrets:
  common: runwarden-secrets-common
  environments:
    development: runwarden-secrets-development
    production: runwarden-secrets-production
# Kubeconfigs of three ServiceAccounts, one namespace each (created by deploy/kind/test.sh).
kube:
  environments:
    development: runwarden-kube-development
    acceptance: runwarden-kube-acceptance
    production: runwarden-kube-production

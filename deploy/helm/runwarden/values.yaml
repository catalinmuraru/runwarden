# Image with Runwarden and your scripts. Usually a scripts image built FROM the Runwarden base
# image (see examples/Dockerfile).
image:
  repository: ghcr.io/catalinmuraru/runwarden
  # Defaults to the chart's appVersion.
  tag: ""
  # sha256:... — when set, the image is pulled by digest and tag is ignored.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

auth:
  # Sign-in methods offered on the sign-in page, in this order: gitlab, oidc, ldap.
  # [none] (alone) disables sign-in for local testing and needs allowNoAuth: true.
  methods: [gitlab]
  # Must also be true for methods [none]: everyone who can reach the server becomes an admin.
  allowNoAuth: false
  # Built-in administrator "admin@local" for bootstrapping and emergencies. While true, a new
  # random password is written at every start to /var/lib/runwarden/initial-admin-password
  # (read it with kubectl exec ... cat); it is never logged. Set back to false once devops
  # users exist: the password file is removed and the administrator's sessions end.
  initialAdmin: false
  # Failed sign-ins allowed per client address (15 minutes) and in total (1 minute) before
  # further attempts are refused, besides 5 per user name and address. 0 = no limit.
  maxFailuresPerIP: 20
  maxFailuresGlobal: 100
  # External URL, e.g. https://runwarden.example.com (required for gitlab and oidc; the
  # provider's redirect URI is <publicUrl>/auth/callback).
  publicUrl: ""
  sessionTTL: 12h
  # true/false; unset means true unless publicUrl is http://.
  cookieSecure: null
  oidc:
    issuerUrl: ""
    clientId: ""
    # Extra scopes, space-separated (e.g. "groups").
    scopes: ""
    usernameClaim: ""
    groupsClaim: ""
    label: ""          # sign-in button text, default "Single sign-on"
    requiredGroup: ""  # only members of this group (or its subgroups) may sign in
  gitlab:
    # Your GitLab, e.g. https://gitlab.example.com (default https://gitlab.com).
    url: ""
    clientId: ""
    label: ""          # sign-in button text, default "GitLab"
    # Only members of this group (full path, subgroups included) may sign in, e.g. company/ops.
    requiredGroup: ""
  ldap:
    url: ""
    startTLS: false
    # Allow ldap:// without StartTLS (passwords in clear text): local testing only.
    insecure: false
    bindDN: ""
    userBaseDN: ""
    userFilter: ""
    groupBaseDN: ""
    groupFilter: ""
    groupNameAttr: ""
    userGroupsAttr: ""
    label: ""          # sign-in button text, default "Directory"

# Name of a Secret, created outside this chart, whose keys become environment variables:
# SESSION_KEY (required unless auth.type=none), OIDC_CLIENT_SECRET or GITLAB_CLIENT_SECRET,
# LDAP_BIND_PASSWORD, and RUNNER_ENV_<NAME> variables passed to scripts as <NAME>.
existingSecret: ""

limits:
  maxConcurrentRuns: 10
  # Default run timeout. A runner config can set its own "timeout" (e.g. "4h" for a database
  # clone), up to runTimeoutMax.
  runTimeout: 60m
  runTimeoutMax: 24h
  killGrace: 10s
  # Runs one user may have in progress at the same time (0 = no limit), admins included.
  maxRunsPerUser: 1
  maxOutputBytes: 10Mi
  maxUploadBytes: 100Mi

runs:
  # per-run: every run gets its own HOME (with KUBECONFIG and AZURE_CONFIG_DIR inside it), so
  # kube contexts, az logins and git credentials of one run never reach another. Scripts log in
  # per run. shared: the old behaviour, one HOME for all runs (for scripts not migrated yet).
  home: per-run
  # ConfigMap copied into every per-run HOME (e.g. key ".gitconfig"; use items/path for
  # ".ssh/known_hosts"). Empty: start with an empty HOME.
  homeSkeletonConfigMap: ""

# Isolation between runs: every run is sandboxed with Landlock (Linux >= 5.13, no privileges
# needed). It cannot read other runs' files or /proc/<pid>/environ, other users' workspaces,
# Runwarden's data or the mounted secrets and kubeconfigs, and with Linux >= 6.12 it cannot
# signal other runs. required: refuse to start without it; auto: run unsandboxed with a
# warning; off: no sandbox.
isolation:
  mode: required
  # More paths every run may read, or read and write (shared by all runs, e.g. /dev/shm).
  readPaths: []
  writePaths: []
  # RLIMIT_NPROC for sandboxed runs (0 = unchanged). It counts every process of the pod's user,
  # Runwarden included, so it is a guard against fork bombs, not a per-run quota.
  maxProcs: 0

# Helper scripts that fill dropdowns and defaults: concurrent calls per user and in total, and
# how long their output is reused ("0" = not cached).
valueScripts:
  maxPerUser: 2
  maxGlobal: 10
  cacheTTL: 60s

# In-app activity log (Admin page): failed sign-ins stop being recorded there once a day's
# file reaches this size. The application log (stdout) keeps everything.
activity:
  maxDayBytes: 50Mi

# Secrets for scripts, per environment: each value is the name of a Kubernetes Secret (created
# outside the chart, e.g. with External Secrets or sealed secrets) mounted read-only at
# /runwarden/secrets/<environment>, one file per key. A run receives only the secrets its
# runner config declares ("secrets": [...]), from the environment it runs in; keys of `common`
# are used when the environment has no key of that name. Environment names must match the
# environments of the access policy (Admin area > Environments).
secrets:
  common: ""
  environments: {}
  #   development: runwarden-secrets-development
  #   production: runwarden-secrets-production

# Kubernetes cluster per environment: each value is the name of a Kubernetes Secret holding a
# kubeconfig under the key "config", mounted read-only at /runwarden/kube/<environment>/config.
# Runners with "kubernetes": true get the kubeconfig of the environment they run in, with its
# context renamed to the environment name. The file is opaque to Runwarden: credentials its exec
# plugin needs come from `secrets` of the same environment. Several environments may share a
# cluster (namespace set in the context). Needs runs.home=per-run.
kube:
  environments: {}
  #   development: runwarden-kube-development
  #   production: runwarden-kube-production

# Access policy: roles, rules and exceptions are edited in the Admin area and kept on the data
# volume (policy.json). The environments here only seed a new policy; afterwards they are
# managed in the Admin area too.
policy:
  # Ordered from least to most sensitive. A script parameter value belongs to the first
  # environment whose name or pattern (* any characters, ? one) matches.
  environments:
    - name: development
      match: ["dev*", "test*"]
    - name: acceptance
      match: ["acc*", "uat*"]
    - name: production
      match: ["prod*", "prd*"]
  # Environment of values that match nothing; empty means the last (most sensitive) one.
  unknownEnvironment: ""
  # Longest time-limited exception an administrator may grant (0 = no limit).
  maxExceptionDays: 90

# Extra hosts allowed to open WebSockets (the server's own host always is).
allowedOrigins: []

# Networks of your ingress controller / load balancer (CIDRs). Requests from them may carry
# X-Forwarded-For, so audit logs and the sign-in rate limit see the real client address.
trustedProxies: []

# Run history retention: age ("90d", "720h", "0" = forever) and maximum number of runs (0 = no
# limit). Running runs are never removed.
history:
  maxAge: 90d
  maxRuns: 0

# Persistent working space for scripts that keep files between runs (git clones, dumps).
# Mounted at /var/lib/runwarden-work, one private directory per user: scripts see their own as
# $RUNWARDEN_WORKSPACE (read-write) and <root>/shared as $RUNWARDEN_SHARED (read-only for runs).
workspace:
  enabled: false
  size: 10Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  existingClaim: ""
  keepOnUninstall: true

runners:
  # Runner configs as file name → config object. Empty: use the configs baked into the image
  # (/runwarden/runners). When set, they replace the image's configs.
  configs: {}

# Run history (DATA_DIR). Without persistence, history is lost when the pod restarts.
persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  existingClaim: ""
  # Keep the claim (and the history) when the release is uninstalled.
  keepOnUninstall: true

# Restrict the pod's network traffic. Plain NetworkPolicy matches IP ranges only: to allow
# external hosts by name (GitLab, Azure) use your CNI's FQDN policies or an egress proxy.
networkPolicy:
  enabled: false
  # Peers allowed to reach the web port, e.g. the ingress controller's namespace:
  #   - namespaceSelector:
  #       matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
  # Empty: any peer. The health port is always open (kubelet probes).
  ingressFrom: []
  egress:
    # Allow DNS to kube-dns in kube-system.
    dns: true
    # Extra NetworkPolicyEgressRule entries, e.g. GitLab, Azure or the API server:
    #   - to: [{ipBlock: {cidr: 10.20.0.0/16}}]
    #     ports: [{port: 443, protocol: TCP}]
    rules: []

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  port: 80

# The ingress controller must allow WebSocket upgrades and long read timeouts (runs can take
# an hour); set the matching annotations for your controller.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
  #  - secretName: runwarden-tls
  #    hosts: [runwarden.example.com]

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Scripts don't get Kubernetes API credentials unless you enable this.
  automountToken: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Longer than limits.killGrace, so running scripts are stopped cleanly on shutdown.
terminationGracePeriodSeconds: 30

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

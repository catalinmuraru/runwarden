{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runwarden.fullname" . }}
  labels:
    {{- include "runwarden.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "runwarden.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
        {{- if $.Values.executors }}
        # The executors dial in.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Chart.Name }}-executor
              app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- end }}
      {{- end }}
    - ports:
        - port: health
  egress:
    {{- if .Values.networkPolicy.egress.dns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.rules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

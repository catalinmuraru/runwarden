apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ward.fullname" . }}
  labels:
    {{- include "ward.labels" . | nindent 4 }}
spec:
  # Running scripts live in this one process: never run two pods side by side.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ward.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ward.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/runners: {{ toJson .Values.runners.configs | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ward.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ward
          image: {{ include "ward.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          env:
            {{- include "ward.env" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.existingSecret .Values.extraEnvFrom }}
          envFrom:
            {{- with .Values.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/ward
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/ward
            {{- if .Values.workspace.enabled }}
            - name: workspace
              mountPath: /var/lib/ward-work
            {{- end }}
            {{- if .Values.runners.configs }}
            - name: runners
              mountPath: /ward/runners
              readOnly: true
            {{- end }}
            {{- if .Values.runs.homeSkeletonConfigMap }}
            - name: home-skeleton
              mountPath: /ward/home-skeleton
              readOnly: true
            {{- end }}
            {{- with .Values.secrets.common }}
            - name: secrets-common
              mountPath: /ward/secrets/common
              readOnly: true
            {{- end }}
            {{- range $i, $env := keys .Values.secrets.environments | sortAlpha }}
            {{- if not (hasKey $.Values.executors $env) }}
            - name: secrets-{{ $i }}
              mountPath: /ward/secrets/{{ $env }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- range $i, $env := keys .Values.kube.environments | sortAlpha }}
            {{- if not (hasKey $.Values.executors $env) }}
            - name: kube-{{ $i }}
              mountPath: /ward/kube/{{ $env }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "ward.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        {{- if .Values.workspace.enabled }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Values.workspace.existingClaim | default (printf "%s-workspace" (include "ward.fullname" .)) }}
        {{- end }}
        {{- if .Values.runners.configs }}
        - name: runners
          configMap:
            name: {{ include "ward.fullname" . }}-runners
        {{- end }}
        {{- with .Values.runs.homeSkeletonConfigMap }}
        - name: home-skeleton
          configMap:
            name: {{ . }}
        {{- end }}
        {{- with .Values.secrets.common }}
        - name: secrets-common
          secret:
            secretName: {{ . }}
            defaultMode: 288 # 0440: readable by the pod's group (fsGroup), not by others
        {{- end }}
        {{- range $i, $env := keys .Values.secrets.environments | sortAlpha }}
        {{- if not (hasKey $.Values.executors $env) }}
        - name: secrets-{{ $i }}
          secret:
            secretName: {{ index $.Values.secrets.environments $env }}
            defaultMode: 288
        {{- end }}
        {{- end }}
        {{- range $i, $env := keys .Values.kube.environments | sortAlpha }}
        {{- if not (hasKey $.Values.executors $env) }}
        - name: kube-{{ $i }}
          secret:
            secretName: {{ index $.Values.kube.environments $env }}
            items:
              - key: config
                path: config
            defaultMode: 288
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

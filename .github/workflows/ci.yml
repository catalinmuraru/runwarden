name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  ui:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: helm lint --strict deploy/helm/runwarden --set 'auth.methods={none}',auth.allowNoAuth=true
      - name: Render with representative values
        run: |
          helm template t deploy/helm/runwarden -f deploy/kind/values-kind.yaml >/dev/null
          helm template t deploy/helm/runwarden --set 'auth.methods={oidc}',existingSecret=s \
            --set auth.publicUrl=https://rw.example.com,auth.oidc.issuerUrl=https://idp,auth.oidc.clientId=rw \
            --set ingress.enabled=true,ingress.host=rw.example.com >/dev/null
          helm template t deploy/helm/runwarden --set 'auth.methods={ldap}',existingSecret=s,auth.initialAdmin=true \
            --set auth.ldap.url=ldaps://dir,auth.ldap.userBaseDN=dc=example \
            --set-json 'runners.configs={"hello":{"name":"Hello","script_path":"/bin/echo"}}' >/dev/null
          helm template t deploy/helm/runwarden --set existingSecret=s,auth.publicUrl=https://rw.example.com \
            --set auth.gitlab.clientId=rw,networkPolicy.enabled=true,runs.homeSkeletonConfigMap=skel >/dev/null
          helm template t deploy/helm/runwarden --set 'auth.methods={gitlab,ldap}',existingSecret=s,auth.publicUrl=https://rw.example.com \
            --set auth.gitlab.clientId=rw,auth.ldap.url=ldaps://dir,auth.ldap.userBaseDN=dc=example >/dev/null
          # [none] must be confirmed with auth.allowNoAuth; the old auth.type is refused with a hint
          if helm template t deploy/helm/runwarden --set 'auth.methods={none}' >/dev/null 2>&1; then exit 1; fi
          if helm template t deploy/helm/runwarden --set auth.type=gitlab,existingSecret=s >/dev/null 2>&1; then exit 1; fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: runwarden:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm runwarden:ci version
          docker build -q -f examples/Dockerfile --build-arg BASE=runwarden:ci -t runwarden-examples:ci .
          docker run --rm --entrypoint runwarden runwarden-examples:ci check-config /etc/runwarden/runners
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: runwarden:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  config-scan:
    name: Config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan Dockerfiles and Helm chart for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_HELM_SET: auth.methods={none},auth.allowNoAuth=true,networkPolicy.enabled=true # the chart needs sign-in settings to render
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
